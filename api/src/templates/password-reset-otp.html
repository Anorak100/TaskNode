<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f7fb; font-family:Arial, Helvetica, sans-serif; color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7fb; margin:0; padding:32px 16px; width:100%;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background:#ffffff; border:1px solid #e2e8f0; border-radius:20px; overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 20px; text-align:center; background:linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);">
                <div style="display:inline-block; width:52px; height:52px; border-radius:14px; background:rgba(255,255,255,0.14); line-height:52px; font-size:26px; color:#ffffff;">🔐</div>
                <h1 style="margin:16px 0 8px; font-size:28px; line-height:1.2; color:#ffffff;">Reset your password</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 8px;">
                <p style="margin:0 0 12px; font-size:16px; line-height:1.6; color:#334155;">
                  We received a request to reset the password for <strong>{{EMAIL}}</strong>.
                </p>
                <p style="margin:0 0 24px; font-size:16px; line-height:1.6; color:#334155;">
                  Use the code below to continue. This code expires in {{EXPIRY_MINUTES}} minutes.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 24px;">
                <div style="display:inline-block; background:#eff6ff; border:1px solid #bfdbfe; border-radius:16px; padding:20px 28px; min-width:220px; text-align:center;">
                  <div style="font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#1d4ed8; font-weight:bold; margin-bottom:10px;">Verification code</div>
                  <div style="font-size:36px; font-weight:700; letter-spacing:8px; color:#0f172a;">{{OTP_CODE}}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;">
                <p style="margin:0; font-size:14px; line-height:1.6; color:#64748b;">
                  If you did not request this reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
